name: Deploy to GitHub Pages & Cloudflare Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: 部署到 GitHub Pages
  deploy-gh-pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[pub-page]') ||
      contains(github.event.head_commit.message, '[pub page]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './unpackage/dist/build/web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: GitHub Pages
      url: ${{ steps.deployment.outputs.page_url }}

  # Job 2: 部署到 Cloudflare Pages
  deploy-cf-pages:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[pub-page]') ||
      contains(github.event.head_commit.message, '[pub page]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy unpackage/dist/build/web --project-name=uniapp-koishi-market

    environment:
      name: Cloudflare Pages
      url: https://uniapp-koishi-market.pages.dev
